<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/devhub-mark-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/devhub-mark-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="DevHub brings developer teams, projects, ideas, and delivery tools together in one collaborative workspace." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("devhub.theme")
          const isDark =
            theme === "dark" ||
            (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", isDark)
          document.documentElement.style.colorScheme = isDark ? "dark" : "light"
        } catch {}
      })()
    </script>
    <title>DevHub — Build together</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
